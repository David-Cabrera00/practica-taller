<section class="bg-stone-100 px-5 py-16">
    <div class="mx-auto max-w-2xl rounded-2xl bg-white p-6 shadow-md md:p-10">

        <h2 class="text-3xl font-black">Contáctanos</h2>
        <p class="mt-2 text-sm text-gray-500">
            Déjanos tu mensaje y te responderemos pronto.
        </p>

        <form class="mt-8 space-y-5">

            <div>
                <label class="mb-2 block text-sm font-bold">
                    Nombre completo
                </label>
                <input
                    type="text"
                    placeholder="Tu nombre"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                >
            </div>

            <div>
                <label class="mb-2 block text-sm font-bold">
                    Correo electrónico
                </label>
                <input
                    type="email"
                    placeholder="correo@ejemplo.com"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                >
            </div>

            <div>
                <label class="mb-2 block text-sm font-bold">
                    Mensaje
                </label>
                <textarea
                    rows="4"
                    placeholder="Escribe tu mensaje..."
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
                ></textarea>
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-orange-600 px-5 py-3 font-bold text-white hover:bg-orange-700"
            >
                Enviar mensaje
            </button>

        </form>
    </div>
</section>
