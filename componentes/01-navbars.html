<!-- =================================================================

     (Estilo Pastelería / E-commerce denso)

<header class="bg-white border-b border-stone-200 px-6 py-4 sticky top-0 z-50">

        <!-- Logo -->
        <div class="text-2xl font-black text-rose-700 tracking-tight">BRAND LOGO</div>
        
        <!-- Buscador Central con Icono -->
        <div class="hidden md:flex items-center bg-stone-100 border border-stone-200 rounded-full px-4 py-1.5 w-72">
            <span class="text-stone-400 text-xs mr-2">🔍</span>
            <input type="text" placeholder="Search..." class="bg-transparent text-xs outline-none w-full text-stone-800 placeholder-stone-400">
        </div>

        <!-- Acciones Derecha -->
        <div class="flex items-center gap-4">
            <a href="#" class="text-xs font-bold text-stone-700 hover:text-rose-700 hidden lg:inline">Login / Register</a>
            <button class="bg-rose-700 text-white px-5 py-2 rounded-full font-bold text-xs tracking-wider shadow-md hover:bg-rose-800 transition">
                ORDER NOW

    </div>

    <!-- Segundo Nivel: Submenú de Enlaces Horizontales -->

</header>
